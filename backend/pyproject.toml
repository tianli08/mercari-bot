[project]
name = "mercari-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "cryptography>=49.0.0",
    "discord-py>=2.6.4",
    "fastapi>=0.140.13",
    "motor>=3.7.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymongo[srv]>=4.16.0",
    "python-dotenv>=1.2.1",
    "selenium>=4.40.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock-motor>=0.0.36",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]


[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "B", "Q", "W", "D"]
# disable period requirement at the end of docstring
lint.ignore = ["D400", "D415"]

[tool.ruff.lint.isort]
known-third-party = ["prisma"]

# follow similar docstring conventions as nvlint
[tool.ruff.lint.pydocstyle]
convention = "google"

# disable undocumented public package for __init__ files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
